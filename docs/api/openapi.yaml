openapi: 3.1.0
info:
  title: Bonsai Harness API
  version: 0.2.0
  summary: Loopback OpenAI-compatible and Anthropic agent harness with MCP and an OpenCode Zen relay.
servers:
  - url: http://127.0.0.1:11431
    description: Default loopback backend
paths:
  /health:
    get:
      operationId: getHealth
      summary: Return runtime-safe harness status without provider keys.
      responses:
        '200':
          description: Runtime status.
  /gateway:
    post:
      operationId: relayOpenCodeZen
      summary: Relay one GET or POST only to https://opencode.ai/zen/v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/$defs/GatewayRequest'
      responses:
        '200': { description: Upstream response is propagated. }
        '400': { description: Invalid envelope or disallowed upstream. }
        '502': { description: Upstream connection failure. }
        '504': { description: Upstream timeout. }
  /api/settings:
    get:
      operationId: getProviderSettings
      summary: Get provider settings with key-presence booleans only.
      responses:
        '200': { description: Settings snapshot. }
    put:
      operationId: updateProviderSettings
      summary: Validate and persist provider settings in backend .env.local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/$defs/SettingsUpdate'
      responses:
        '200': { description: Updated safe snapshot. }
        '400': { description: Invalid settings update. }
  /api/mcp/servers:
    get:
      operationId: listMcpServers
      summary: List registry summaries and whether each local entry point is available or connected.
      responses:
        '200': { description: MCP server inventory. }
  /api/mcp/servers/{name}/connect:
    post:
      operationId: connectMcpServer
      summary: Start an installed MCP stdio server and discover its tools.
      parameters:
        - $ref: '#/$defs/McpServerName'
      responses:
        '200': { description: Connection summary. }
        '400': { description: Unknown, unavailable, or invalid MCP server. }
  /api/mcp/servers/{name}:
    delete:
      operationId: disconnectMcpServer
      summary: Stop one connected MCP process.
      parameters:
        - $ref: '#/$defs/McpServerName'
      responses:
        '200': { description: MCP server disconnected. }
        '404': { description: MCP server was not connected. }
$defs:
  McpServerName:
    name: name
    in: path
    required: true
    schema: { type: string, minLength: 1 }
  RuntimeKind:
    type: string
    enum: [openai-compatible, anthropic]
  SafetyMode:
    type: string
    enum: [plan, ask, auto, yolo]
  GatewayRequest:
    type: object
    additionalProperties: false
    required: [targetUrl]
    properties:
      targetUrl: { type: string, format: uri, pattern: '^https://opencode\\.ai/zen/v1(?:/|$)' }
      method: { type: string, enum: [GET, POST], default: POST }
      headers:
        type: object
        additionalProperties: { type: string }
      body: { type: string }
  SettingsUpdate:
    type: object
    properties:
      runtimeKind: { $ref: '#/$defs/RuntimeKind' }
      modelId: { type: string, minLength: 1 }
      openai:
        type: object
        properties:
          apiBaseUrl: { type: string, format: uri }
          apiPath: { type: string, pattern: '^/[^?#\\]*$' }
          apiKey: { type: string, writeOnly: true }
          maxTokens: { type: number, minimum: 1, maximum: 128000 }
          temperature: { type: number, minimum: 0, maximum: 2 }
      anthropic:
        type: object
        properties:
          apiBaseUrl: { type: string, format: uri }
          apiKey: { type: string, writeOnly: true }
          maxTokens: { type: number, minimum: 1, maximum: 128000 }
          temperature: { type: number, minimum: 0, maximum: 2 }
  WebSocketClientMessage:
    oneOf:
      - type: object
        required: [action, agentId, prompt]
        properties:
          action: { const: spawn_agent }
          agentId: { type: string, minLength: 1 }
          prompt: { type: string, minLength: 1 }
          modelId: { type: string }
          runtimeKind: { $ref: '#/$defs/RuntimeKind' }
          safetyMode: { $ref: '#/$defs/SafetyMode' }
      - type: object
        required: [action, payload]
        properties:
          action: { const: send_message }
          payload: { type: string, minLength: 1 }
          safetyMode: { $ref: '#/$defs/SafetyMode' }
      - type: object
        required: [action, requestId, approved]
        properties:
          action: { const: resolve_tool_approval }
          requestId: { type: string, minLength: 1 }
          approved: { type: boolean }
      - type: object
        required: [action]
        properties:
          action: { const: stop_generation }
